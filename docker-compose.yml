name: hammerfall

x-telemetry-env: &telemetry-env
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1}

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${PGUSER:-hammerfall}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Copy .env.example to .env before starting Compose}
      POSTGRES_DB: hammerfall_development
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "hammerfall.auction-events.v1", "--partitions", "3", "--replication-factor", "1"]

  api:
    image: hammerfall-api
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    environment:
      <<: *telemetry-env
      RAILS_ENV: development
      CABLE_WORKER_THREADS: ${CABLE_WORKER_THREADS:-2}
      CABLE_ALLOWED_ORIGINS: ${CABLE_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      IDEMPOTENCY_RETENTION_DAYS: ${IDEMPOTENCY_RETENTION_DAYS:-7}
      IDEMPOTENCY_PRUNE_BATCH_SIZE: ${IDEMPOTENCY_PRUNE_BATCH_SIZE:-1000}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-hammerfall}
      PGPASSWORD: ${PGPASSWORD:?Copy .env.example to .env before starting Compose}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3000"
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle
      - api_tmp:/app/tmp
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "(bundle check || bundle install) && bin/rails db:prepare && exec bin/rails server -b 0.0.0.0 -P /tmp/hammerfall-puma.pid"]
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).code == '200' ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auction-closer:
    image: hammerfall-api
    environment:
      <<: *telemetry-env
      RAILS_ENV: development
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-hammerfall}
      PGPASSWORD: ${PGPASSWORD:?Copy .env.example to .env before starting Compose}
      REDIS_URL: redis://redis:6379/0
      AUCTION_CLOSER_INTERVAL: ${AUCTION_CLOSER_INTERVAL:-1}
      AUCTION_CLOSER_BATCH_SIZE: ${AUCTION_CLOSER_BATCH_SIZE:-100}
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle
    depends_on:
      api:
        condition: service_healthy
    command: ["bin/auction_closer"]
    restart: on-failure
    stop_grace_period: 15s

  sidekiq:
    image: hammerfall-api
    environment:
      <<: *telemetry-env
      RAILS_ENV: development
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-hammerfall}
      PGPASSWORD: ${PGPASSWORD:?Copy .env.example to .env before starting Compose}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq", "-r", "./config/environment.rb", "-C", "config/sidekiq.yml"]
    restart: on-failure
    stop_grace_period: 20s

  outbox-publisher:
    image: hammerfall-api
    environment:
      <<: *telemetry-env
      RAILS_ENV: development
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-hammerfall}
      PGPASSWORD: ${PGPASSWORD:?Copy .env.example to .env before starting Compose}
      REDIS_URL: redis://redis:6379/0
      OUTBOX_PUBLISH_INTERVAL: ${OUTBOX_PUBLISH_INTERVAL:-1}
      OUTBOX_PUBLISH_BATCH_SIZE: ${OUTBOX_PUBLISH_BATCH_SIZE:-100}
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle
    depends_on:
      api:
        condition: service_healthy
    command: ["bin/outbox_publisher"]
    restart: on-failure
    stop_grace_period: 15s

  kafka-outbox-publisher:
    image: hammerfall-api
    environment:
      <<: *telemetry-env
      RAILS_ENV: development
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-hammerfall}
      PGPASSWORD: ${PGPASSWORD:?Copy .env.example to .env before starting Compose}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PUBLISH_INTERVAL: ${KAFKA_PUBLISH_INTERVAL:-1}
      KAFKA_PUBLISH_BATCH_SIZE: ${KAFKA_PUBLISH_BATCH_SIZE:-100}
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle
    depends_on:
      api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["bin/kafka_outbox_publisher"]
    restart: on-failure
    stop_grace_period: 15s

  kafka-audit-consumer:
    image: hammerfall-api
    environment:
      <<: *telemetry-env
      RAILS_ENV: development
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-hammerfall}
      PGPASSWORD: ${PGPASSWORD:?Copy .env.example to .env before starting Compose}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle
    depends_on:
      api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["bin/kafka_audit_consumer"]
    stop_grace_period: 15s

  kafka-projection-consumer:
    image: hammerfall-api
    environment:
      <<: *telemetry-env
      RAILS_ENV: development
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-hammerfall}
      PGPASSWORD: ${PGPASSWORD:?Copy .env.example to .env before starting Compose}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["bin/kafka_projection_consumer"]
    stop_grace_period: 15s

  reconciliation-scheduler:
    image: hammerfall-api
    environment:
      <<: *telemetry-env
      RAILS_ENV: development
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-hammerfall}
      PGPASSWORD: ${PGPASSWORD:?Copy .env.example to .env before starting Compose}
      REDIS_URL: redis://redis:6379/0
      RECONCILIATION_INTERVAL: ${RECONCILIATION_INTERVAL:-60}
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bin/reconciliation_scheduler"]
    restart: on-failure
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: infrastructure/web.Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      API_ORIGIN: http://api:3000
      NEXT_PUBLIC_CABLE_URL: ${NEXT_PUBLIC_CABLE_URL:-ws://localhost:3001/cable}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/observability/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose: ["4318", "9464"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    expose: ["3200", "4318"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  api_bundle:
  api_tmp:
  web_node_modules:
  web_next:
  prometheus_data:
  tempo_data:
  grafana_data:
