default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 3) %>
  host: <%= ENV.fetch("PGHOST", "127.0.0.1") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "hammerfall") %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: hammerfall_development

test:
  <<: *default
  database: hammerfall_test

# Rails merges DATABASE_URL when provided. Production must supply it explicitly.
production:
  url: <%= ENV["DATABASE_URL"] %>
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 3) %>
