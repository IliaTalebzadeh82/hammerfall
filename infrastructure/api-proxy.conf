upstream hammerfall_api {
    server api:3000;
    server api-replica-b:3000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 3000;

    location /cable {
        proxy_pass http://hammerfall_api;
        # Local diagnostic: identify the socket-owning upstream at the upgrade.
        add_header X-Hammerfall-Cable-Upstream $upstream_addr always;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    location / {
        proxy_pass http://hammerfall_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection close;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
