apiVersion: v1
kind: ConfigMap
metadata:
  name: hammerfall-config
  namespace: hammerfall
data:
  RAILS_ENV: development
  PERFORMANCE_DISABLE_RELOADING: "true"
  PGHOST: db
  PGPORT: "5432"
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CABLE_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  CABLE_WORKER_THREADS: "2"
  OTEL_ENABLED: "false"
  AUCTION_CLOSER_INTERVAL: "1"
  RECONCILIATION_INTERVAL: "60"
