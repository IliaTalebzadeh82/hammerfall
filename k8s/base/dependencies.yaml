# Selectorless Services point to Compose containers through EndpointSlices
# generated by k8s/local/up.sh. Stateful data stays outside Kubernetes.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: hammerfall
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hammerfall
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: hammerfall
spec:
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
