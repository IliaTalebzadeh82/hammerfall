apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hammerfall-public
  namespace: hammerfall
  annotations:
    networking.gke.io/certmap: CERT_MAP_NAME
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
  - type: NamedAddress
    value: STATIC_IP_NAME
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: PUBLIC_HOSTNAME.invalid
  - name: https
    protocol: HTTPS
    port: 443
    hostname: PUBLIC_HOSTNAME.invalid
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hammerfall-redirect
  namespace: hammerfall
spec:
  parentRefs:
  - name: hammerfall-public
    sectionName: http
  hostnames:
  - PUBLIC_HOSTNAME.invalid
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hammerfall-https
  namespace: hammerfall
spec:
  parentRefs:
  - name: hammerfall-public
    sectionName: https
  hostnames:
  - PUBLIC_HOSTNAME.invalid
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: api
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /cable
    backendRefs:
    - name: api
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: web
      port: 3000
