apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hammerfall-db-gke
  namespace: hammerfall
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/hammerfall-reference-database-url/versions/1"
        path: "database-url"
      - resourceName: "projects/PROJECT_ID/secrets/hammerfall-reference-secret-key-base/versions/1"
        path: "secret-key-base"
      - resourceName: "projects/PROJECT_ID/secrets/hammerfall-reference-cloud-sql-ca-bundle/versions/1"
        path: "cloud-sql-ca.pem"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hammerfall-db-redis-gke
  namespace: hammerfall
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/hammerfall-reference-database-url/versions/1"
        path: "database-url"
      - resourceName: "projects/PROJECT_ID/secrets/hammerfall-reference-secret-key-base/versions/1"
        path: "secret-key-base"
      - resourceName: "projects/PROJECT_ID/secrets/hammerfall-reference-cloud-sql-ca-bundle/versions/1"
        path: "cloud-sql-ca.pem"
      - resourceName: "projects/PROJECT_ID/secrets/hammerfall-reference-redis-ca-bundle/versions/1"
        path: "redis-ca.pem"
