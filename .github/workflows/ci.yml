name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGUSER: hammerfall
      PGPASSWORD: hammerfall_ci_only
    steps:
      - uses: actions/checkout@v5
      - name: Start PostgreSQL and Redis
        working-directory: .
        run: |
          cp .env.example .env
          docker compose up -d --wait db redis
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/api
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - run: bin/bundler-audit
      - run: bin/rails db:prepare zeitwerk:check
      - run: bundle exec rspec
      - name: Database service logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color db redis
      - name: Stop database services
        if: always()
        working-directory: .
        run: docker compose down -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser test dependencies
        working-directory: apps/web
        run: npm ci
      - run: cp .env.example .env
      - name: Match container user to runner
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 360
      - run: curl --fail http://localhost:3001/up && curl --fail http://localhost:3000
      - name: Redis, Kafka and scheduled job smoke
        run: |
          docker compose exec -T redis redis-cli ping
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic hammerfall.auction-events.v1
          docker compose exec -T reconciliation-scheduler bin/reconciliation_scheduler --once
          docker compose exec -T outbox-publisher bin/outbox_publisher --once
          docker compose exec -T kafka-outbox-publisher bin/kafka_outbox_publisher --once
          docker compose ps sidekiq outbox-publisher kafka-outbox-publisher kafka-audit-consumer kafka-projection-consumer
      - name: Kafka end-to-end smoke
        run: docker compose exec -T api ruby < scripts/smoke-kafka
      - name: Sequential auction API smoke
        run: docker compose exec -T -e API_BASE_URL=http://127.0.0.1:3000 api ruby < scripts/smoke-api
      - name: Independent closer one-shot
        run: docker compose exec -T auction-closer bin/auction_closer --once
      - name: Concurrent auction API smoke
        run: docker compose exec -T -e API_BASE_URL=http://127.0.0.1:3000 api ruby < scripts/smoke-concurrent-bids
      - name: Proxy bidding API smoke
        run: docker compose exec -T -e API_BASE_URL=http://127.0.0.1:3000 api ruby < scripts/smoke-proxy-bidding
      - name: Cross-replica auction correctness
        run: docker compose exec -T api bin/rails runner script/phase17_session1.rb
      - name: Bounded idempotency pruning task
        run: docker compose exec -T api bin/rails idempotency:prune
      - name: Seed real browser verification
        run: |
          docker compose exec -T api bin/rails db:seed
      - name: Check runner Chrome
        run: /usr/bin/google-chrome --version
      - name: Real API browser scenarios
        working-directory: apps/web
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: npm run test:e2e
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
