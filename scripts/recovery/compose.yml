name: hammerfall-phase22-recovery
services:
  primary:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: hammerfall
      POSTGRES_PASSWORD: ${PHASE22_DB_PASSWORD:?Run scripts/recovery/phase22-pitr}
      POSTGRES_DB: hammerfall_development
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_command=cp %p /recovery/wal/%f", "-c", "archive_timeout=5s"]
    volumes:
      - ${PHASE22_WORK_DIR:?}:/recovery
      - phase22_primary:/var/lib/postgresql
    networks:
      ordinary:
        aliases: [phase22-primary]
  recovered:
    image: postgres:18.6-bookworm
    profiles: [restore]
    environment:
      PGDATA: /recovery/restored-data
      POSTGRES_PASSWORD: ${PHASE22_DB_PASSWORD:?Run scripts/recovery/phase22-pitr}
    volumes:
      - ${PHASE22_WORK_DIR:?}:/recovery
    networks:
      ordinary:
        aliases: [phase22-recovered]
  recovery-redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      ordinary:
        aliases: [phase22-redis]
  old-kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@old-kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://phase22-old-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - phase22_old_kafka:/var/lib/kafka/data
    networks:
      ordinary:
        aliases: [phase22-old-kafka]
  fresh-kafka:
    image: apache/kafka:4.1.2
    profiles: [restore]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@fresh-kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://phase22-fresh-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - phase22_fresh_kafka:/var/lib/kafka/data
    networks:
      ordinary:
        aliases: [phase22-fresh-kafka]
  api-a:
    image: hammerfall-api
    profiles: [live]
    environment: &live-api-env
      RAILS_ENV: development
      PGHOST: ${PHASE22_API_PGHOST:-phase22-primary}
      PGPORT: 5432
      PGUSER: hammerfall
      PGPASSWORD: ${PHASE22_DB_PASSWORD:?Run scripts/recovery/phase22-pitr}
      REDIS_URL: redis://phase22-redis:6379/0
      RECOVERY_FENCE: ${PHASE22_RECOVERY_FENCE:-false}
      OPERATOR_API_ENABLED: "false"
      HAMMERFALL_INSTANCE: a
    volumes:
      - ../../apps/api:/app
      - phase22_api_tmp:/app/tmp
    ports:
      - "127.0.0.1:3903:3000"
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-P", "/tmp/phase22-api-a.pid"]
    networks:
      ordinary:
        aliases: [phase22-api-a]
  api-b:
    image: hammerfall-api
    profiles: [live]
    environment:
      <<: *live-api-env
      HAMMERFALL_INSTANCE: b
    volumes:
      - ../../apps/api:/app
      - phase22_api_tmp:/app/tmp
    ports:
      - "127.0.0.1:3904:3000"
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-P", "/tmp/phase22-api-b.pid"]
    networks:
      ordinary:
        aliases: [phase22-api-b]
  ingress:
    image: nginx:1.29-alpine
    profiles: [live]
    ports:
      - "127.0.0.1:3901:3000"
    volumes:
      - ./nginx-phase22.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      ordinary:
        aliases: [phase22-ingress]
  operator-api:
    image: hammerfall-api
    profiles: [live]
    environment:
      <<: *live-api-env
      RECOVERY_FENCE: "false"
      OPERATOR_API_ENABLED: "true"
      HAMMERFALL_INSTANCE: operator
    ports:
      - "127.0.0.1:3902:3000"
    volumes:
      - ../../apps/api:/app
      - phase22_api_tmp:/app/tmp
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-P", "/tmp/phase22-operator.pid"]
    networks:
      ordinary:
        aliases: [phase22-operator-api]
  kafka-metric-publisher:
    image: hammerfall-api
    profiles: [live]
    environment:
      RAILS_ENV: development
      PGHOST: ${PHASE22_API_PGHOST:-phase22-primary}
      PGPORT: 5432
      PGUSER: hammerfall
      PGPASSWORD: ${PHASE22_DB_PASSWORD:?Run scripts/recovery/phase22-pitr}
      KAFKA_BOOTSTRAP_SERVERS: ${PHASE22_KAFKA_ENDPOINT:-phase22-old-kafka:9092}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phase22-otel-collector:4318
    volumes:
      - ../../apps/api:/app
    command: ["bin/kafka_outbox_publisher"]
    networks:
      ordinary:
        aliases: [phase22-kafka-metric-publisher]
  recovery-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: [live]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector-phase22.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      ordinary:
        aliases: [phase22-otel-collector]
  recovery-prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [live]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus-phase22.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infrastructure/observability/hammerfall-alerts.yml:/etc/prometheus/hammerfall-alerts.yml:ro
      - phase22_prometheus:/prometheus
    ports:
      - "127.0.0.1:3909:9090"
    networks:
      ordinary:
        aliases: [phase22-prometheus]
  sidekiq-worker:
    image: hammerfall-api
    profiles: [live]
    environment:
      RAILS_ENV: development
      PGHOST: phase22-recovered
      PGPORT: 5432
      PGUSER: hammerfall
      PGPASSWORD: ${PHASE22_DB_PASSWORD:?Run scripts/recovery/phase22-pitr}
      REDIS_URL: redis://phase22-redis:6379/0
    volumes:
      - ../../apps/api:/app
    command: ["bundle", "exec", "sidekiq", "-r", "./config/environment.rb", "-C", "config/sidekiq.yml"]
    networks:
      ordinary:
        aliases: [phase22-sidekiq-worker]
networks:
  ordinary:
    external: true
    name: hammerfall_default
volumes:
  phase22_primary:
  phase22_old_kafka:
  phase22_fresh_kafka:
  phase22_api_tmp:
  phase22_prometheus:
